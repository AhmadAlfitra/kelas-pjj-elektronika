<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamera Absensi PJJ</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:24px 14px;font-family:system-ui,sans-serif;background:#eff6ff;color:#172554;line-height:1.6}.card{max-width:600px;margin:auto;background:white;padding:25px;border-radius:22px;box-shadow:0 12px 40px #17255415}h1{margin-top:0;font-size:26px}video,img{width:100%;max-height:450px;object-fit:contain;background:#0f172a;border-radius:14px}video{transform:scaleX(-1)}button{font:inherit;padding:13px 16px;border:0;border-radius:11px;background:#2563eb;color:white;margin:7px 4px 7px 0;cursor:pointer}button:disabled{background:#cbd5e1;color:#475569;cursor:not-allowed}.status{background:#f1f5f9;padding:13px;border-radius:11px;white-space:pre-line}small{color:#64748b}button:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
</style></head><body><main class="card"><small>XI TAV · KAMERA ABSENSI</small><h1>Ambil foto langsung</h1><p>Pastikan wajah terlihat jelas. Foto dikirim ke portal untuk diperiksa sebelum absensi disimpan.</p><video id="video" autoplay muted playsinline hidden></video><img id="preview" alt="Foto yang akan dikirim" hidden><div><button id="start">Aktifkan kamera</button><button id="capture" disabled>Ambil foto</button><button id="retake" hidden>Foto ulang</button><button id="send" hidden>Kirim foto ke portal</button></div><p id="status" class="status" role="status" aria-live="polite"></p><small>Tidak tersedia unggah galeri. Jika kamera tidak dapat digunakan, kembali ke portal dan laporkan kendala.</small></main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1));
let target='',nonce=params.get('nonce')||'',stream=null,photo='',valid=false;
function status(s){$('status').textContent=s;}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
try{const u=new URL(params.get('parent')||'');const h=u.hostname;valid=u.protocol==='https:'&&(h==='script.google.com'||h==='script.googleusercontent.com'||h.endsWith('.script.googleusercontent.com'))&&u.origin===params.get('parent')&&/^[a-f0-9-]{36}$/i.test(nonce)&&!!window.opener;target=u.origin;}catch(e){}
if(!valid){$('start').disabled=true;status('Buka halaman ini melalui tombol Buka kamera langsung di portal Apps Script, bukan langsung dari alamat GitHub.');}else status('Tekan Aktifkan kamera, lalu izinkan akses kamera pada browser.');
$('start').onclick=async()=>{if(!valid)return;$('start').disabled=true;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Browser tidak mendukung kamera. Gunakan Chrome/Safari terbaru melalui HTTPS.');stop();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=stream;$('video').hidden=false;await $('video').play();$('capture').disabled=false;status('Kamera aktif. Posisikan wajah di tengah, lalu tekan Ambil foto.');}catch(e){stop();$('start').disabled=false;const messages={NotAllowedError:'Izin kamera ditolak. Izinkan kamera pada pengaturan situs, lalu coba lagi.',NotFoundError:'Kamera tidak ditemukan pada perangkat.',NotReadableError:'Kamera tidak dapat dibuka. Tutup aplikasi lain yang memakai kamera.'};status(messages[e.name]||e.message);}};
$('capture').onclick=()=>{try{const v=$('video');if(!v.videoWidth||!v.videoHeight)throw Error('Tunggu sampai gambar kamera tampil.');const c=document.createElement('canvas'),scale=Math.min(1,960/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext('2d').drawImage(v,0,0,c.width,c.height);let q=.82;photo=c.toDataURL('image/jpeg',q);while(photo.length>780000&&q>.25){q-=.1;photo=c.toDataURL('image/jpeg',q);}if(photo.length>780000)throw Error('Foto terlalu besar. Coba ambil ulang.');$('preview').src=photo;$('preview').hidden=false;$('video').hidden=true;$('capture').disabled=true;$('retake').hidden=false;$('send').hidden=false;stop();status('Periksa foto. Tekan Kirim foto ke portal atau Foto ulang.');}catch(e){status(e.message);}};
$('retake').onclick=()=>{photo='';$('preview').removeAttribute('src');$('preview').hidden=true;$('retake').hidden=true;$('send').hidden=true;$('start').disabled=false;$('start').click();};
$('send').onclick=()=>{try{if(!valid||!photo||!window.opener||window.opener.closed)throw Error('Portal tidak tersedia. Buka kembali kamera dari portal.');window.opener.postMessage({type:'PJJ_CAMERA_PHOTO',nonce:nonce,photo:photo},target);$('send').disabled=true;status('Foto telah dikirim ke jendela portal. Kembali ke tab portal dan pastikan pratinjau foto muncul, lalu tekan Kirim absensi awal. Jika belum muncul, jangan anggap absensi sudah tersimpan; laporkan kendala.');stop();}catch(e){status(e.message);}};
window.addEventListener('pagehide',stop);
</script></body></html>
